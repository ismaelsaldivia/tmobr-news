name: Update TMOBR News

on:
  schedule:
    - cron: "23 9 * * *"    # 06:23 Montevideo (GitHub suele demorar; listo cerca de las 07:00)
    - cron: "23 19 * * *"   # 16:23 Montevideo (listo cerca de las 17:00)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-news
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install feedparser==6.0.11
      - name: Build edition
        env:
          ANTHROPIC_API_KEY: ${{ secrets.TMOBR_NEWS }}
        run: python scripts/build.py
      - name: Publish
        run: |
          git config user.name "tmobr-news-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html data/news.json
          git diff --cached --quiet || git commit -m "Edition $(TZ=America/Montevideo date '+%Y-%m-%d %H:%M')"
          git push
